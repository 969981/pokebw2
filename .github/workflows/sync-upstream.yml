name: Sync upstream pokebw2

on:
  schedule:
    # UTC 00:17, 06:17, 12:17, 18:17 (Singapore 08:17, 14:17, 20:17, 02:17)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokebw2-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == '969981/pokebw2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream main and current local main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/fuddlesworth/pokebw2.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B main refs/remotes/origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream-main source mirror (keep fork workflows)
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN cannot push upstream modifications under .github/workflows.
          # Keep the fork's workflow tree but merge all other upstream source changes.
          git fetch --no-tags origin +refs/heads/upstream-main:refs/remotes/origin/upstream-main
          git switch -C upstream-main refs/remotes/origin/upstream-main
          UPSTREAM=$(git rev-parse refs/remotes/upstream/main)
          if ! git merge-base --is-ancestor "$UPSTREAM" HEAD; then
            BEFORE=$(git rev-parse HEAD)
            if ! git merge --no-ff --no-commit refs/remotes/upstream/main; then
              git rev-parse -q --verify MERGE_HEAD >/dev/null || exit 1
            fi
            while IFS= read -r -d '' conflicted; do
              case "$conflicted" in
                .github/workflows/*) git rm -f --cached -- "$conflicted" ;;
              esac
            done < <(git diff --name-only --diff-filter=U -z)
            git restore --source="$BEFORE" --staged --worktree -- .github/workflows
            if [[ -n "$(git ls-files -u)" ]]; then
              echo "::error::Unresolved upstream source conflicts in upstream-main"
              git ls-files -u
              exit 1
            fi
            git commit -m "chore(sync): upstream sources $UPSTREAM"
            git diff --quiet "$BEFORE" HEAD -- .github/workflows || exit 1
            git push origin HEAD:refs/heads/upstream-main
          fi
          git switch main
          echo "Upstream source snapshot: $(git rev-parse --short refs/remotes/upstream/main); fork CI preserved" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge upstream into main without overwriting local changes
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse refs/remotes/upstream/main)
          if git merge-base --is-ancestor "$UPSTREAM" HEAD; then
            echo "Already contains all upstream commits."
            echo "main already contains upstream $UPSTREAM" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git -c merge.conflictStyle=zdiff3 merge --no-ff --no-commit refs/remotes/upstream/main; then
            git rev-parse -q --verify MERGE_HEAD >/dev/null || exit 1
          fi
          # Preserve local CI configuration and avoid GitHub workflow-write denial.
          while IFS= read -r -d '' conflicted; do
            case "$conflicted" in
              .github/workflows/*) git rm -f --cached -- "$conflicted" ;;
            esac
          done < <(git diff --name-only --diff-filter=U -z)
          git restore --source="$BEFORE" --staged --worktree -- .github/workflows
          if [[ -n "$(git ls-files -u)" ]]; then
            git status --short
            echo "::error::Unresolved non-workflow upstream conflicts. No push."
            exit 1
          fi
          git commit -m "chore(sync): merge upstream $UPSTREAM"
          git diff --quiet "$BEFORE" HEAD -- .github/workflows || {
            echo "::error::Local workflows must remain unchanged."; exit 1;
          }
          git push origin HEAD:refs/heads/main
          AFTER=$(git rev-parse HEAD)
          {
            echo "Merged upstream $UPSTREAM into main."
            echo "main: $BEFORE -> $AFTER"
          } >> "$GITHUB_STEP_SUMMARY"
