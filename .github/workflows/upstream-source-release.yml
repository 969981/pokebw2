# Mirror updates are handled by sync-upstream.yml. Publish only sources:
# a compiled ROM requires user-owned Nintendo game input and is never distributed.
name: Release synchronized pokebw2 sources

on:
  workflow_run:
    workflows: ['Sync upstream pokebw2']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokebw2-source-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == '969981/pokebw2' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm upstream revision was synchronized
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/fuddlesworth/pokebw2.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          upstream_sha="$(git rev-parse refs/remotes/upstream/main)"
          if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'Current upstream is not yet included in downstream main; skipping release.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="upstream-${upstream_sha:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; no duplicate."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'ready=true'
            echo "tag=$tag"
            echo "upstream=$upstream_sha"
            echo "downstream=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble ROM-free sources and SHA256SUMS
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.meta.outputs.upstream }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=pokebw2/ HEAD | gzip -n > "dist/pokebw2-source-${UPSTREAM_SHA:0:12}.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish source-only prerelease
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.meta.outputs.upstream }}
          DOWNSTREAM_SHA: ${{ steps.meta.outputs.downstream }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          printf 'Unofficial source-only snapshot from fuddlesworth/pokebw2.\nUpstream: %s\nMirror: %s\nNo game ROM or copyrighted game input is included.\n' "$UPSTREAM_SHA" "$DOWNSTREAM_SHA" > release-notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$DOWNSTREAM_SHA" \
            --title "pokebw2 upstream ${UPSTREAM_SHA:0:12} (source)" \
            --notes-file release-notes.md \
            --prerelease
